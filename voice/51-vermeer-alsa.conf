# One ACP/UCM owner for card 0. The compressed endpoint belongs to that same
# card; probing it as another HiFi card creates duplicate PCM nodes and UCM
# sequences, and breaks device reservation in WirePlumber's ALSA monitor.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.comprC0" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
