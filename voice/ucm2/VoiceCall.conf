# Private UCM profile for the hostless voice controller. PipeWire retains
# its regular HiFi UCM configuration and releases the card during calls.
SectionVerb {
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='Voice Call Switch' 1"
		cset "name='Voice Call Mic Switch' 1"
	]
	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='Voice Call Switch' 0"
		cset "name='Top Speaker MUX' Speaker"
		cset "name='Amplifier L Profile Set' Music"
		cset "name='Amplifier R Profile Set' Music"
	]
	Value { TQ "Voice" }
}

SectionDevice."Mic" {
	Comment "Built-in microphone"
	EnableSequence [
		cdev "hw:${CardId}"
		# Use the mainline-tested AMIC1 route. Two DMA channels currently
		# carry the same microphone; Android's SWR_MIC4/9 mapping is wrong
		# for this kernel and must not be copied into this profile.
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX_AIF1_CAP Mixer DEC3' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX0 MODE' ADC_LP"
		cset "name='ADC1 Volume' 8"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='DEC1 MODE' ADC_DEFAULT"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]
	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
	]
	Value {
		CapturePCM "hw:${CardId},6"
		CaptureChannels 2
		CaptureRate 48000
	}
}

SectionDevice."Earpiece" {
	Comment "Top receiver"
	ConflictingDevice [ "Speaker" ]
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='Voice Call Route' Handset"
		cset "name='Top Speaker MUX' Receiver"
		cset "name='Amplifier L Profile Set' Receiver"
		cset "name='Amplifier R Profile Set' Voice"
		cset "name='Amplifier L PCM Playback Volume' 360"
		cset "name='Amplifier R PCM Playback Volume' 0"
	]
	Value {
		PlaybackPCM "hw:${CardId},6"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Speaker" {
	Comment "Speakerphone"
	ConflictingDevice [ "Earpiece" ]
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='Voice Call Route' Speaker"
		cset "name='Top Speaker MUX' Speaker"
		cset "name='Amplifier L Profile Set' Voice"
		cset "name='Amplifier R Profile Set' Voice"
		cset "name='Amplifier L PCM Playback Volume' 360"
		cset "name='Amplifier R PCM Playback Volume' 360"
	]
	Value {
		PlaybackPCM "hw:${CardId},6"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}
