# SPDX-License-Identifier: BSD-3-Clause
SectionVerb {
	EnableSequence [
		cdev "hw:${CardId}"
		# PipeWire probes PCM 0 after selecting the verb, BEFORE enabling
		# Speaker. ASoC rejects PCM open without a connected backend.
		# Keep only this backend connected during verb/profile probing.
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' off"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' off"
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' on"
		# Capture PCM 2 also requires a backend before PipeWire probes it.
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' off"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' on"
	]

	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' off"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone"

	EnableSequence [
		cdev "hw:${CardId}"
		# Keep Android's AMIC1 gain/mode, but NOT its unverified port
		# selectors. Live mainline tests: SWR_MIC4/9 become all-zero;
		# SWR_MIC0 receives AMIC1. Feed it to both contiguous DMA channels
		# so stereo-only PCM 2 does not leave a silent channel when mixed
		# to mono by applications. This is ONE physical microphone.
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX_AIF1_CAP Mixer DEC3' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX0 MODE' ADC_LP"
		cset "name='ADC1 Volume' 8"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='DEC1 MODE' ADC_DEFAULT"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' on"
	]

	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' off"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureRate 48000
		# The frontend accepts stereo only; both channels carry AMIC1.
		CaptureChannels 2
		# Match Android raw gain fields, not its misleading dB TLVs.
		# Requires the corrected SWR_INPUT0 -> ADC1_OUTPUT DT route.
	}
}

SectionDevice."Speaker" {
	Comment "Built-in stereo speakers"

	EnableSequence [
		cdev "hw:${CardId}"
		# 8192 is unity gain; the topology's generated dB TLV is incorrect.
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
		# User-requested 0 dB digital attenuation (360), not the earlier
		# conservative bring-up level of 270 (-22.5 dB).
		# This graph does not implement Android's DSP speaker protection.
		cset "name='Amplifier L PCM Playback Volume' 360"
		cset "name='Amplifier R PCM Playback Volume' 360"
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' on"
	]

	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackRate 48000
		PlaybackChannels 2
		# Deliberately no PlaybackMixerElem/PlaybackVolume: the sound
		# server should attenuate in software, not turn up either amp
		# or use the DSP volume control's incorrect dB scale.
	}
}
